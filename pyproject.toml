[project]
name = "myxai-desk"
version = "2.0.0-alpha"
description = "Policy-First Desktop Agent OS"
requires-python = ">=3.10"
dependencies = [
    "nanobot-ai>=0.1.4",
    "pywebview>=5.0",
    "flask>=3.0",
    "pyyaml>=6.0",
    "pystray>=0.19",
    "Pillow>=10.0",
    "croniter>=1.3",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "pyright>=1.1.350",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["myxai_desk"]

[tool.setuptools.package-data]
myxai_desk = ["py.typed"]

# ============================================================================
# Ruff Configuration (Linting & Formatting)
# ============================================================================
[tool.ruff]
# 设置行长度
line-length = 100
# 目标 Python 版本
target-version = "py310"
# 要排除的目录
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# 启用的规则集
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
]
# 忽略的规则
ignore = [
    "E501",   # 行过长（由 formatter 处理）
    "B008",   # 函数调用中的默认参数
    "B904",   # raise without from inside except
    "N802",   # 函数名应该小写（兼容现有代码）
    "N806",   # 变量名应该小写（兼容现有代码）
]

# 每个文件的忽略规则
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # 允许未使用的导入
"test_*.py" = ["S101"]    # 允许在测试中使用 assert
"**/tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["myxai_desk"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
# 使用双引号
quote-style = "double"
# 缩进风格
indent-style = "space"
# 行尾处理
line-ending = "auto"

# ============================================================================
# Pyright Configuration (Type Checking)
# ============================================================================
[tool.pyright]
include = ["myxai_desk", "apps", "app.py", "desk_manager.py"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".venv",
    "build",
    "dist",
]
# 定义源码根目录
pythonVersion = "3.10"
pythonPlatform = "All"
# 类型检查模式：basic（宽松）-> standard -> strict
typeCheckingMode = "basic"
# 增量启用严格检查
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedVariable = "warning"
reportUnusedImport = "warning"
reportDuplicateImport = "warning"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
# 暂时关闭的检查（逐步启用）
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportMissingTypeArgument = false
reportGeneralTypeIssues = false
# 输出详细信息
verboseOutput = false

# ============================================================================
# Pytest Configuration
# ============================================================================
[tool.pytest.ini_options]
# 测试发现路径
testpaths = ["tests"]
# Python 文件匹配模式
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 命令行选项
addopts = [
    "-v",                           # 详细输出
    "--strict-markers",             # 严格标记模式
    "--tb=short",                   # 简短的 traceback
    "--cov=myxai_desk",             # 覆盖率检查
    "--cov-report=term-missing",    # 终端显示缺失行
    "--cov-report=html",            # HTML 报告
    "--cov-report=xml",             # XML 报告（CI 使用）
]
# 标记定义
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "asyncio: Async tests",
]
# Asyncio 配置
asyncio_mode = "auto"

# ============================================================================
# Coverage Configuration
# ============================================================================
[tool.coverage.run]
source = ["myxai_desk"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
# 覆盖率门槛（先设为 10%，逐步提升）
fail_under = 10
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
