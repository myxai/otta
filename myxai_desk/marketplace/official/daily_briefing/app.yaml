id: "daily_briefing"
name: "每日私享会"
name_en: "Daily Briefing"
version: "2.0.0"
source: "official"
entry: "prompt"
prompt_file: "prompt.md"
description: "你的私人资讯策展人——基于浏览和对话，每天精选最值得关注的内容，支持深入探索"
description_en: "Your personal curator — daily picks based on your interests, with deep-dive exploration"
author: "MyxAI"

triggers:
  - type: "cron"
    cron: "0 22 * * *"

permissions:
  - "profile.read.summary"
  - "profile.read.topics"
  - "search.web"
  - "notify.push"

budgets:
  tokens_per_day: 120000
  search_calls_per_day: 40

mode_requirements:
  min_mode: "Observer"

data_policy:
  allow_raw_history: false
  allow_network_exfiltration: false

outputs:
  - type: "report.html"
    path: "reports/{{date}}.html"

ui:
  icon: "🎯"
  category: "briefing"
